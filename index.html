<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Imagend — AI Prompt Optimizer</title>
<meta name="description" content="Turn any idea into a max-detail AI image or video prompt. Stops hallucinations across Midjourney, Veo, Kling, Runway, Flux and more.">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0a0a0d; --surface:#141420; --line:rgba(255,255,255,0.06); --line-strong:rgba(255,255,255,0.12);
    --text:#f4f4f8; --muted:#a2a2b0; --accent:#ab90ff;
    --ease:cubic-bezier(.2,.6,.2,1);
    --display:'Bricolage Grotesque',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --ui:'Hanken Grotesque',sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  .frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:block}
  .frame.hidden{display:none}

  /* ── Portal tab ── */
  .portal-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:5px;
    background:linear-gradient(160deg,rgba(30,24,54,.96),rgba(18,14,34,.96));border:1px solid var(--line-strong);border-right:none;
    border-radius:16px 0 0 16px;padding:14px 11px 14px 13px;cursor:pointer;color:var(--text);box-shadow:-8px 0 30px -12px rgba(0,0,0,.7);
    backdrop-filter:blur(8px);transition:transform .25s var(--ease),box-shadow .25s var(--ease),padding .25s var(--ease)}
  .portal-tab:hover{transform:translateY(-50%) translateX(-4px);box-shadow:-14px 0 40px -10px rgba(171,144,255,.5);padding-right:16px}
  .portal-tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .portal-tab-icon{font-size:20px;line-height:1;filter:drop-shadow(0 0 8px rgba(171,144,255,.5))}
  .portal-tab-label{font-family:var(--mono);font-size:9px;line-height:1.15;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center}
  .portal-tab-arrow{font-size:13px;color:var(--accent);transition:transform .25s var(--ease)}
  .portal-tab:hover .portal-tab-arrow{transform:translateX(3px)}
  @media(max-width:560px){.portal-tab{padding:10px 7px 10px 9px}.portal-tab-icon{font-size:17px}.portal-tab-label{font-size:8px}}

  /* ── Portal veil ── */
  .portal-veil{position:fixed;inset:0;z-index:200;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0}
  .portal-veil .portal-iris{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 50% 50%, #ff6fae 0%, #a07bff 45%, #0c0a1a 78%);
    box-shadow:0 0 80px 20px rgba(171,144,255,.6)}
  .portal-veil .portal-word{position:relative;z-index:2;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;color:#fff;opacity:0;transform:scale(.9)}
  .portal-veil.opening{opacity:1;transition:opacity .15s linear}
  .portal-veil.opening .portal-iris{transition:transform .55s cubic-bezier(.7,0,.3,1);transform:translate(-50%,-50%) scale(60)}
  .portal-veil.opening .portal-word{transition:opacity .3s ease .2s,transform .4s ease .2s;opacity:1;transform:scale(1)}
  .portal-veil.arrived{opacity:1}
  .portal-veil.arrived .portal-iris{transform:translate(-50%,-50%) scale(60)}
  .portal-veil.arrived .portal-word{opacity:1;transform:scale(1)}
  .portal-veil.closing{opacity:0;transition:opacity .5s ease .35s}
  .portal-veil.closing .portal-iris{transition:transform .6s cubic-bezier(.6,0,.2,1);transform:translate(-50%,-50%) scale(0)}
  .portal-veil.closing .portal-word{transition:opacity .3s ease;opacity:0}
  @media(prefers-reduced-motion:reduce){.portal-veil .portal-iris,.portal-veil .portal-word{transition:none!important}.portal-veil.opening{transition:opacity .2s linear}}

  /* ── Auth gate ── */
  #authGate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;
    transition:opacity .35s var(--ease)}
  #authGate.hidden{opacity:0;pointer-events:none}
  .auth-card{width:100%;max-width:400px;padding:48px 40px 40px;text-align:center;
    background:linear-gradient(160deg,rgba(20,20,32,.98),rgba(12,10,26,.98));
    border:1px solid var(--line-strong);border-radius:24px;box-shadow:0 32px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(171,144,255,.08);}
  .auth-iris{width:48px;height:48px;border-radius:50%;margin:0 auto 20px;
    background:radial-gradient(circle at 50% 50%,#ff6fae 0%,#a07bff 45%,#0c0a1a 78%);
    box-shadow:0 0 40px 8px rgba(171,144,255,.35)}
  .auth-name{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;color:var(--text);margin-bottom:8px}
  .auth-tagline{font-family:var(--ui);font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:36px;max-width:280px;margin-left:auto;margin-right:auto}
  .auth-google{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:none;
    border-radius:12px;padding:13px 24px;font-family:var(--ui);font-weight:600;font-size:15px;cursor:pointer;
    width:100%;justify-content:center;transition:box-shadow .2s var(--ease),transform .15s var(--ease)}
  .auth-google:hover{box-shadow:0 8px 24px -8px rgba(171,144,255,.4);transform:translateY(-1px)}
  .auth-google svg{flex-shrink:0}
  .auth-divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--muted);font-size:12px;font-family:var(--mono)}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .auth-beta{display:flex;gap:8px;margin-bottom:20px}
  .auth-beta input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none}
  .auth-beta input:focus{border-color:var(--accent)}
  .auth-beta input::placeholder{color:var(--muted);opacity:.6}
  .auth-beta button{background:rgba(171,144,255,.15);border:1px solid rgba(171,144,255,.3);border-radius:10px;
    padding:11px 18px;font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer;white-space:nowrap}
  .auth-beta button:hover{background:rgba(171,144,255,.25)}
  .auth-legal{font-family:var(--mono);font-size:10px;color:var(--muted);opacity:.6;line-height:1.6;margin-top:20px}
  .auth-legal a{color:var(--muted);text-decoration:underline}
  .auth-loading{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:16px;display:none}
  #authError{font-family:var(--mono);font-size:11px;color:#ff8fa3;margin-top:12px;min-height:16px}

  /* ── Iframe loading overlay ── */
  #frameLoader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
    pointer-events:none;transition:opacity .4s var(--ease)}
  #frameLoader.gone{opacity:0}
  .loader-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.3;margin:0 4px;
    animation:ldot 1.2s ease-in-out infinite}
  .loader-dot:nth-child(2){animation-delay:.2s}
  .loader-dot:nth-child(3){animation-delay:.4s}
  @keyframes ldot{0%,80%,100%{opacity:.15;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
</style>
</head>

      <div class="auth-divider">or</div>
      <div class="auth-beta">

  <!-- Loading dots shown while the active iframe is loading -->

  <iframe class="frame" id="frameImage" title="Imagend image prompt optimizer" allow="clipboard-write; clipboard-read"></iframe>

  <button class="portal-tab" id="portalTab" type="button" aria-label="Switch world">
    <span class="portal-tab-icon" id="tabIcon">&#127916;</span>

    <span class="portal-tab-arrow">&#8594;</span>
  </button>
  <div class="portal-veil" id="portalVeil" aria-hidden="true"><div class="portal-iris"></div><div class="portal-word" id="veilWord">Imagend</div></div>

  function ensureLoaded(world){
    if(loaded[world]) return;
    frames[world].srcdoc=decode(DOCS[world]);
    loaded[world]=true;
    frames[world].addEventListener("load",function(){
      harden(frames[world]);
      // Send session to the iframe once it's loaded
      if(currentSession) sendSessionTo(frames[world],currentSession);
      setTimeout(function(){loader.classList.add("gone");},200);
    },{once:true});
  }
  function harden(frame){
    try{
      var d=frame.contentDocument; if(!d) return;
      ["portalTab","portalVeil"].forEach(function(id){var el=d.getElementById(id);if(el)el.style.display="none";});
    }catch(e){}
  }
  function sendSessionTo(frame,session){
    try{
      frame.contentWindow.postMessage({
        type:"IMAGEND_SESSION",
        session:{access_token:session.access_token,refresh_token:session.refresh_token},
        user:{id:session.user.id,email:session.user.email}
      },"*");
    }catch(e){}
  }
  function broadcastSession(session){
    currentSession=session;
    ["image","video"].forEach(function(w){
      if(loaded[w]) sendSessionTo(frames[w],session);
    });
  }
  function setTab(world){
    if(world==="image"){tabIcon.textContent=VID_ICON;tabLabel.innerHTML="Video<br>world";}
    else{tabIcon.textContent=IMG_ICON;tabLabel.innerHTML="Image<br>world";}
  }
  function show(world){
    ensureLoaded(world);
    frames.image.classList.toggle("hidden",world!=="image");
    frames.video.classList.toggle("hidden",world!=="video");
    current=world; setTab(world);
    try{localStorage.setItem(KEY,world);}catch(e){}
  }

  /* ── Auth gate ── */
  var authGate=document.getElementById("authGate");
  var authError=document.getElementById("authError");

  function showGate(){authGate.classList.remove("hidden");}
  function hideGate(){authGate.classList.add("hidden");}

  document.getElementById("authGoogleBtn").onclick=function(){
    authError.textContent="";
    supa.auth.signInWithOAuth({
      provider:"google",
      options:{redirectTo:window.location.origin+window.location.pathname}
    }).then(function(r){
      if(r.error) authError.textContent=r.error.message;
    });
  };

  // BETATESTER code on the auth gate doesn't bypass login — it just saves the code
  // for the inner tools to redeem after the user signs in normally
  document.getElementById("authCodeBtn").onclick=function(){
    var code=(document.getElementById("authCodeInput").value||"").trim().toUpperCase();
    if(code==="BETATESTER"){
      try{localStorage.setItem("imagend:pendingCode",code);localStorage.setItem("imagendv:pendingCode",code);}catch(e){}
      authError.style.color="var(--accent)";
      authError.textContent="✓ Code saved — sign in with Google to activate it";
    } else {
      authError.style.color="#ff8fa3";
      authError.textContent="Code not recognised";
    }
  };

  /* ── Listen for postMessages from iframes ── */
  window.addEventListener("message",function(e){
    if(!e.data) return;
    if(e.data.type==="IMAGEND_SIGNOUT"){
      supa.auth.signOut().then(function(){ currentSession=null; showGate(); });
    }
    if(e.data.type==="IMAGEND_UPGRADE"){
      // TODO: redirect to Lemon Squeezy checkout when payment is wired
      // window.open("https://your-store.lemonsqueezy.com/checkout/...", "_blank");
      alert("Pro upgrade coming soon! Your beta code gives you free access until September 2026.");
    }
  });

  /* ── Supabase auth state — single source of truth ── */
  supa.auth.onAuthStateChange(function(event,session){
    if(session){
      hideGate();
      broadcastSession(session);
      // Start the app on the last-used world
      if(!loaded[current]) show(current);
      setTimeout(function(){ensureLoaded(current==="image"?"video":"image");},1400);
    } else {
      showGate();
    }
  });

  // Check for existing session on hard load (handles post-OAuth redirect)
  supa.auth.getSession().then(function(r){
    if(r.data&&r.data.session){
      hideGate();
      broadcastSession(r.data.session);
      show(current);
      setTimeout(function(){ensureLoaded(current==="image"?"video":"image");},1400);
    } else {
      showGate();
    }
  });

  /* ── Portal tab ── */
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var busy=false;
  tab.addEventListener("click",function(){
    if(busy) return; busy=true;
    var other=current==="image"?"video":"image";
    veilWord.textContent="Imagend";
    loader.classList.remove("gone");
    if(reduce){show(other);busy=false;return;}
    veil.setAttribute("aria-hidden","false");
    veil.className="portal-veil opening";
    setTimeout(function(){
      show(other);
      veil.className="portal-veil arrived";
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        veil.className="portal-veil closing";
        setTimeout(function(){veil.className="portal-veil";veil.setAttribute("aria-hidden","true");busy=false;},1050);
      });});
    },620);
  });
})();
</script>
</body>
</html>
